services:
  db:
    image: postgres:17
    container_name: draft_game_db
    restart: always
    environment:
      - POSTGRES_USER=$POSTGRES_USER
      - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
      - POSTGRES_DB=$POSTGRES_DB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    container_name: draft_game_api
    build: .
    # command: fastapi run app/main.py --port 8000
    tty: true
    volumes:
      - .:/app
    ports:
      - 8000:8000
    env_file:
      - ./.env
    depends_on:
      - db


volumes:
  postgres_data:
    name: draft-game-postgres
